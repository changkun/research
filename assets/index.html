<script>
    (function() {
        var toggle = document.querySelector('.theme-toggle');
        toggle.addEventListener('click', function() {
            var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            try { localStorage.setItem('theme', next); } catch (e) {}
        });
        // The menu marks the section being read: the last one whose heading
        // has scrolled up to the menu.
        var menu = document.querySelector('.sections-inner');
        var links = document.querySelectorAll('.sections a');
        var headings = Array.prototype.map.call(links, function(a) {
            return document.getElementById(a.getAttribute('href').slice(1));
        });
        // Scroll the menu, never the page, to keep the marked link in view.
        // scrollIntoView would scroll the page too: the menu sits inside
        // the page's scroll padding, which it treats as hidden.
        function reveal(a) {
            var m = menu.getBoundingClientRect(), r = a.getBoundingClientRect();
            var fade = 48;
            if (r.left < m.left) menu.scrollLeft -= m.left - r.left + 16;
            else if (r.right > m.right - fade) menu.scrollLeft += r.right - (m.right - fade) + 16;
        }
        var ticking = false, marked = -2;
        function mark() {
            ticking = false;
            var current = -1;
            headings.forEach(function(h, i) {
                if (h && h.getBoundingClientRect().top <= 72) current = i;
            });
            if (current === marked) return;
            marked = current;
            links.forEach(function(a, i) {
                if (i === current) {
                    a.setAttribute('aria-current', 'true');
                    reveal(a);
                } else {
                    a.removeAttribute('aria-current');
                }
            });
        }
        window.addEventListener('scroll', function() {
            if (!ticking) { ticking = true; requestAnimationFrame(mark); }
        }, {passive: true});
        mark();

        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
            var saved = null;
            try { saved = localStorage.getItem('theme'); } catch (err) {}
            if (!saved) document.documentElement.setAttribute('data-theme', e.matches ? 'dark' : 'light');
        });
    })();
</script>
